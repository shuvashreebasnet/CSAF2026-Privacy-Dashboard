<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Why Permissions | sheCodes</title>
		<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet"> <!--Lexend font link-->
        <link rel = "icon" href = ".\assets\sheCodes26Icon.png"> <!--sheCodes logo icon-->		
		<link rel="stylesheet" href="styles.css">
		<script src="index.js" defer></script>
	</head>
	<body class="why-permissions-page">
		<header class="fixed-header">
			<img src="./assets/sheCodes26Icon.png" alt="sheCodes logo">
			<h2>sheCodes</h2>
			<h1>Why Permissions</h1>
		</header>

		<nav class="navbar" aria-label="Main navigation">
			<ul>
				<li><a href="./index.html">Dashboard</a></li>
				<li><a href="./whypermissions.html" class="active" aria-current="page">Why Permissions</a></li>
			</ul>
		</nav>

		<main class="why-permissions-content">
			<header class="permission-heading">
				<div class="permission-heading-copy">
					<h2 id="selected-app-name">ChatGPT</h2>
					<p>Understand the permission choices available and what can happen when you allow or deny access.</p>
				</div>
				<div class="permission-controls">
					<!-- Selects which app's permission cards are displayed. -->
					<div class="permission-app-picker">
						<label for="permission-app-select">Choose an App</label>
						<select id="permission-app-select">
							<option value="chatgpt">ChatGPT</option>
							<option value="tiktok">TikTok</option>
							<option value="instagram">Instagram</option>
							<option value="temu">Temu</option>
							<option value="whatsapp">WhatsApp</option>
							<option value="facebook">Facebook</option>
						</select>
					</div>
				</div>
			</header>

			<!-- Filled with the selected app's permission records by index.js. -->
			<section class="permission-options" id="permission-options" aria-label="ChatGPT permission levels"></section>
		</main>

		<!-- Lets visitors choose the permission-description font size. -->
		<fieldset class="description-size-picker">
			<legend>Text Size</legend>
			<label><input type="radio" name="description-size" value="20" checked>20px</label>
			<label><input type="radio" name="description-size" value="25">25px</label>
			<label><input type="radio" name="description-size" value="30">30px</label>
		</fieldset>
	</body>
</html>
